[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "football-tactical-analyzer-backend"
version = "0.1.0"
description = "API for Football Tactical Analyzer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.10,<3.0",
    "uvicorn>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "starlette>=1.3.1,<2",
    "anyio>=4.14.2,<5",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "ruff>=0.17,<1", "pip-audit>=2.9,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
